# Release
#
# Open/update the release pull request; build and test the project; and publish the release.
#
# This workflow consumes the following from build-test.yml:
#   1. $.jobs.build-test (this exact job ID)
#   2. The artifact named "build"
#
# One-time setup
#   1. Go to GitHub repo > Settings > General > Releases > Enable release immutability.
#   2. Go to GitHub repo > Settings > Actions > General > Workflow permissions: Read and write permissions.
#   3. On that same page, check "Allow GitHub Actions to create and approve pull requests".
#
# Public repositories can use attest for free. Private repos require Enterprise Cloud.
#
# The manifest config bumps version.txt (Release Please's simple strategy) and module.json.
# FreeScout compares those two strings. skip-github-release stops Release Please from creating the tag.
# The publish job creates the tag with gh release create. Release Please recognizes tags shaped like v1.2.3.
# version.txt and module.json stay without the v. A tag shaped like 1.2.3 does not count.
#
# Check a published file:
#   gh release verify OWNER/REPO v1.2.3
#   gh attestation verify ./SidebarWebhook.zip -R OWNER/REPO
#   gh attestation verify ./SidebarWebhook.zip -R OWNER/REPO --bundle ./release.sigstore.jsonl
#   gh attestation verify ./SidebarWebhook.zip -R OWNER/REPO --bundle ./release.sigstore.jsonl --predicate-type urn:version

name: Release

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish, for example v1.2.3. Leave empty to open or update the release pull request only.
        required: false
        type: string

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  propose:
    name: Open or update the release pull request
    if: github.event_name == 'push' || inputs.tag == ''
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.merged.outputs.pr }}
      tag_name: ${{ steps.merged.outputs.tag_name }}
    steps:
      - name: Open the release pull request
        uses: googleapis/release-please-action@v5
        with:
          skip-github-release: true
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Find a merged release pull request
        id: merged
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          found=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '
            .[] | select(.merged_at != null and any(.labels[]; .name == "autorelease: pending"))
            | "\(.number) v\(.title | capture("release (?<v>[0-9]+[.][0-9]+[.][0-9]+)").v)"' | head -n 1)
          if [ -n "$found" ]; then
            read -r pr tag <<< "$found"
            echo "pr=$pr" >> "$GITHUB_OUTPUT"
            echo "tag_name=$tag" >> "$GITHUB_OUTPUT"
          fi

  resolve:
    name: Resolve the commit to publish
    needs: propose
    if: |
      always() &&
      (needs.propose.result == 'success' || needs.propose.result == 'skipped') &&
      (needs.propose.outputs.tag_name != '' ||
       (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.pick.outputs.ref }}
    steps:
      # An existing tag is packed from its own commit. A new tag is packed from
      # this workflow's SHA. gh release create does not move a tag that exists.
      - name: Pick the commit
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || needs.propose.outputs.tag_name }}
        run: |
          set -euo pipefail
          if object=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '{sha:.object.sha,type:.object.type}'); then
            sha=$(printf '%s' "$object" | jq -r .sha)
            type=$(printf '%s' "$object" | jq -r .type)
            if [ "$type" = "tag" ]; then
              sha=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$sha" --jq .object.sha)
            fi
          else
            sha="$GITHUB_SHA"
          fi
          # actions/attest records this workflow's SHA. Packing a different
          # commit would publish provenance for the wrong source.
          if [ "$sha" != "$GITHUB_SHA" ]; then
            echo "::error::Tag $TAG is $sha, but this workflow is $GITHUB_SHA. Re-run the workflow from that tag so the attestation matches the packed commit."
            exit 1
          fi
          echo "ref=$sha" >> "$GITHUB_OUTPUT"

  build-test:
    name: Build and test
    needs: [propose, resolve]
    if: always() && needs.resolve.result == 'success'
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    uses: ./.github/workflows/build-test.yml
    with:
      ref: ${{ needs.resolve.outputs.ref }}

  publish:
    name: Publish release
    needs: [propose, resolve, build-test]
    if: |
      always() &&
      needs.build-test.result == 'success' &&
      (needs.propose.outputs.tag_name != '' ||
       (github.event_name == 'workflow_dispatch' && inputs.tag != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      attestations: write
    steps:
      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: build
          path: dist

      # Out of dist/ so the version attestation does not take it as a subject.
      - name: Set the provenance bundle aside
        run: mv dist/attestation.sigstore.json "$RUNNER_TEMP/provenance.sigstore.json"

      - name: Resolve the tag
        id: tag
        env:
          TAG: ${{ inputs.tag || needs.propose.outputs.tag_name }}
        run: |
          case "$TAG" in
            v*.*.*) ;;
            *) echo "tag must look like v1.2.3" >&2; exit 1 ;;
          esac
          file_version="$(tr -d '[:space:]' < dist/version.txt)"
          if [ "$file_version" != "${TAG#v}" ]; then
            echo "version.txt ($file_version) does not match tag ($TAG)" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Attest the version
        id: version
        uses: actions/attest@v4
        with:
          subject-path: dist/*
          predicate-type: urn:version
          predicate: ${{ format('{{"version":"{0}"}}', steps.tag.outputs.version) }}

      # dist/* was already attested. Write the sidecar after, so it is not a subject.
      - name: Write the sidecar
        env:
          VERSION_BUNDLE: ${{ steps.version.outputs.bundle-path }}
        run: |
          jq -c . "$RUNNER_TEMP/provenance.sigstore.json" > dist/release.sigstore.jsonl
          jq -c . "$VERSION_BUNDLE" >> dist/release.sigstore.jsonl

      - name: Check the sidecar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in dist/*; do
            [ "$f" = dist/release.sigstore.jsonl ] && continue
            gh attestation verify "$f" -R "$GITHUB_REPOSITORY" --bundle dist/release.sigstore.jsonl
            gh attestation verify "$f" -R "$GITHUB_REPOSITORY" --bundle dist/release.sigstore.jsonl \
              --predicate-type urn:version
          done

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # One call, files included. A later upload fails once release immutability is on.
          # SidebarWebhook.zip and version.txt are what FreeScout's updater downloads.
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ needs.resolve.outputs.ref }}" \
            --title "$TAG" \
            --generate-notes \
            --latest

      - name: Mark the release pull request tagged
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.propose.outputs.pr }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail
          pr="$PR"
          if [ -z "$pr" ]; then
            version="${TAG#v}"
            pr=$(gh pr list --repo "$GITHUB_REPOSITORY" --state merged --limit 30 \
              --json number,title,labels \
              --jq ".[] | select(.title | test(\"release ${version}( |$)\")) | select(any(.labels[]; .name == \"autorelease: pending\")) | .number" \
              | head -n 1)
          fi
          if [ -z "$pr" ]; then
            echo "No release pull request to mark"
            exit 0
          fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/issues/$pr/labels/autorelease:%20pending"
          gh api "repos/$GITHUB_REPOSITORY/issues/$pr/labels" -f "labels[]=autorelease: tagged"
