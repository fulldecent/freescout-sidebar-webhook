name: Release

# Publishes a release with SidebarWebhook.zip and version.txt attached for every version tag.
# module.json points FreeScout's auto-updater at these assets via releases/latest/download/.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to (re)build assets for
        required: true

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      # FreeScout offers an update when version.txt is newer than the installed module.json,
      # so a release whose module.json was not bumped would be offered again and again.
      - name: Check that the tag matches module.json
        run: |
          version="$(jq -r .version module.json)"
          if [ "$version" != "$TAG" ]; then
            echo "::error::Tag '$TAG' does not match module.json version '$version'"
            exit 1
          fi

      # FreeScout extracts the zip into Modules/ as-is, so its root folder must be SidebarWebhook/.
      - name: Build assets
        run: |
          git archive --format=zip --prefix=SidebarWebhook/ -o SidebarWebhook.zip HEAD
          echo "$TAG" > version.txt
          unzip -l SidebarWebhook.zip

      # gh release create uploads to a draft and publishes it afterwards, so releases/latest
      # never points at a release without assets.
      - name: Publish the release with its assets
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" SidebarWebhook.zip version.txt --clobber
          else
            gh release create "$TAG" SidebarWebhook.zip version.txt --verify-tag --title "$TAG" --generate-notes
          fi
